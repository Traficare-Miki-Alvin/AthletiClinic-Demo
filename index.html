<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a24"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>AthletiClinic</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f9;color:#111827}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}.box{background:#fff;border:1px solid #e6e9ee;border-radius:18px;padding:28px;max-width:440px;width:100%;box-sizing:border-box}.spin{width:34px;height:34px;border:4px solid #eee;border-top-color:#f15a2b;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}.err{color:#b42318}</style></head><body><div class="loading" id="loader"><div class="box"><div class="spin"></div><h2>טוען את AthletiClinic</h2><p>הדמו נטען. הטעינה הראשונה יכולה להימשך מספר שניות.</p><div id="err"></div></div></div><script>
(async()=>{
const files=['./payload/p01.txt','./payload/p02.txt','./payload/p03.txt','./payload/p04.txt','./payload/p05.txt','./payload/p06.txt','./payload/p07.txt','./payload/p08.txt','./payload/p09.txt','./payload/p10.txt','./payload/p11.txt','./payload/p12a.txt','./payload/p12-02.txt','./payload/p12-03.txt','./payload/p12d.txt','./payload/p13.txt'],version='v41-deterministic-20261016-2';
const photos={'דניאל כהן':`./avatars/daniel.svg?${version}`,'נועה לוי':`./avatars/noa.svg?${version}`,'רון אדרי':`./avatars/ron.svg?${version}`,'ליאור גפן':`./avatars/lior.svg?${version}`};
const fail=m=>{const e=document.getElementById('err');if(e)e.innerHTML=`<p class="err">${m}</p><button onclick="location.reload()">נסה שוב</button>`};
async function unzip(s){const b=atob(s.replace(/\s+/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function patch(p){const r=await fetch(`${p}?${version}`,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${p}`);return JSON.parse(await unzip(await r.text()))}
function inject(h,p,id){const cs='</sty'+'le>',js='</scr'+'ipt>';return h.replace('</head>',`<style id="${id}-css">${p.css||''}${cs}</head>`).replace('</body>',`<script id="${id}-js">${p.js||''}${js}</body>`)}
try{
if(!('DecompressionStream'in window))throw Error('יש להשתמש ב-Safari או Chrome עדכניים.');
try{navigator.serviceWorker?.getRegistrations?.().then(x=>x.forEach(r=>r.unregister()))}catch(_){ }
await Promise.all(Object.values(photos).map(s=>new Promise(ok=>{const i=new Image;i.onload=i.onerror=ok;i.src=s})));
try{const r=await fetch(`./v37-avatars.json?${version}`,{cache:'no-store'});if(r.ok){const j=await r.json(),m={'יוסי ברק':'staff_male','מאיה שלו':'staff_female','עומר שחר':'staff_male','תומר בר':'staff_male'};for(const[n,k]of Object.entries(m))if(j[k])photos[n]='data:image/jpeg;base64,'+j[k]}}catch(_){ }
const a=[];for(const f of files){const r=await fetch(`${f}?${version}`,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${f}`);a.push(await r.text())}let h=await unzip(a.join(''));
for(const [f,id] of [['./v31-patch.txt','v31-mobile-fixes'],['./v32-patch.txt','v32-mobile-fixes'],['./v34-patch.txt','v34-runtime-fixes'],['./v35-patch.txt','v35-mobile-polish']])h=inject(h,await patch(f),id);
const map=`<script>window.__ATHLETI_PROFILE_PHOTOS=${JSON.stringify(photos)};<\/script>`;h=h.replace('<body>','<body>'+map).replace("function v23Portrait(name){return name==='דניאל כהן'?V23_IMG.avatar:V23_IMG.therapist}","function v23Portrait(name){return (window.__ATHLETI_PROFILE_PHOTOS&&window.__ATHLETI_PROFILE_PHOTOS[name])||(name==='דניאל כהן'?V23_IMG.avatar:V23_IMG.therapist)}");
const fr=await fetch(`./v41-fix.js?${version}`,{cache:'no-store'});if(!fr.ok)throw Error(`${fr.status} v41-fix.js`);const fix=await fr.text(),cs='</scr'+'ipt>';h=h.replace('</body>',`<script id="v41-fix">${fix}${cs}</body>`);document.open();document.write(h);document.close();
}catch(e){console.error(e);fail(e?.message||'לא ניתן לטעון את הדמו')}
})();
</script></body></html>
